[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "binny"
version = "2.3.0.dev0"
description = "binny: automated binning by iterative embedding and HDBSCAN clustering with CheckM marker-set assessment (modernised front end)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Oskar Hickl"}, {name = "Anna Heintz-Buschart"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow", "scipy", "scikit-learn>=1.3", "hdbscan>=0.8.33",
  "openTSNE>=1.0", "networkx>=3", "matplotlib", "joblib", "pyrodigal>=3", "pyhmmer>=0.10",
]

[project.scripts]
binny = "binny.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
